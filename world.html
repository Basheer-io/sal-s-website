<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Sal's World</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box}
body{margin:0;background:#24221f;color:#f2eada;font-family:'Pixelify Sans',monospace;overflow:hidden;touch-action:none}
#game,canvas{position:fixed;inset:0;display:block;image-rendering:pixelated}
.px{font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.6}
.hud{position:fixed;top:14px;left:14px;z-index:5;display:flex;gap:10px;align-items:center}
.hud a,.hud span{background:#f2eada;color:#24221f;padding:10px 12px;text-decoration:none}
.hud span{background:#24221f;color:#f2eada;box-shadow:0 0 0 3px #f2eada}
#mmf{position:fixed;right:14px;top:14px;width:160px;height:120px;box-shadow:0 0 0 4px #f2eada;pointer-events:none;z-index:4}
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:5;background:#f2eada;color:#24221f;padding:12px 14px;display:none;white-space:nowrap;box-shadow:0 0 0 4px #24221f,0 0 0 8px #f2eada}
#panel{position:fixed;inset:0;z-index:10;background:rgba(36,34,31,.9);display:none;align-items:center;justify-content:center;padding:18px}
.card{background:#f2eada;color:#24221f;width:min(580px,100%);max-height:86vh;overflow:auto;padding:28px;box-shadow:0 0 0 4px #24221f,0 0 0 8px #f2eada;position:relative;font-size:1.1rem;line-height:1.55}
.card h2{font-family:'Press Start 2P',monospace;font-size:1rem;line-height:1.5;margin:0 0 16px;padding-right:44px}
.card p{margin:0 0 12px}.card ul{padding-left:20px;margin:0 0 6px}.card li{margin-bottom:6px}
.x{position:absolute;right:14px;top:14px;border:0;background:#24221f;color:#f2eada;font-family:'Press Start 2P',monospace;font-size:12px;padding:10px;cursor:pointer}
.links{display:grid;gap:12px;margin-top:6px}
.links a{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#24221f;color:#f2eada;text-decoration:none;padding:14px;font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.5}
.links a small{font-family:'Pixelify Sans',monospace;font-size:1rem;opacity:.75;text-align:right}
.links a:hover{background:#47433c}
#pad{position:fixed;left:16px;bottom:18px;z-index:6;display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:6px}
#pad button,#act{background:rgba(242,234,218,.88);border:0;color:#24221f;font-size:18px;touch-action:none}
#pad .u{grid-column:2}#pad .l{grid-column:1;grid-row:2}#pad .r{grid-column:3;grid-row:2}#pad .d{grid-column:2;grid-row:3}
#act{position:fixed;right:18px;bottom:24px;z-index:6;display:none;width:92px;height:92px;font-family:'Press Start 2P',monospace;font-size:11px}
@media(hover:none){#pad{display:grid}#act{display:block}#hint{bottom:130px}}
@media(max-width:560px){#mmf{width:110px;height:82px}}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}.tags span{background:#24221f;color:#f2eada;padding:3px 10px;font-size:.95rem}
.card h3{font-family:'Press Start 2P',monospace;font-size:.7rem;line-height:1.6;margin:18px 0 10px}
.proj{border:3px solid #24221f;padding:14px;margin-bottom:14px}.proj h3{margin-top:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.stats div{background:#24221f;color:#f2eada;padding:12px}.stats b{display:block;font-family:'Press Start 2P',monospace;font-size:.85rem;margin-bottom:6px}
.quote{border-left:6px solid #24221f;padding-left:12px;margin:14px 0 0;font-style:italic}
</style>
</head>

addEventListener('keydown',e=>{

  update(){
    const k=this.keys,p=this.p;this.water.tilePositionX+=.25;this.water.tilePositionY+=.1;
    let dx=0,dy=0;
    if(!isOpen){
      dx=(k.RIGHT.isDown||k.D.isDown||pad.r?1:0)-(k.LEFT.isDown||k.A.isDown||pad.l?1:0);
      dy=(k.DOWN.isDown||k.S.isDown||pad.d?1:0)-(k.UP.isDown||k.W.isDown||pad.u?1:0);
    }
    if(dx&&dy){if(this.axis==='x')dy=0;else dx=0}else if(dx)this.axis='x';else if(dy)this.axis='y';
    if(dx)this.dir=dx>0?'right':'left';else if(dy)this.dir=dy>0?'down':'up';
    p.setVelocity(dx*130,dy*130);
    if(dx||dy)p.anims.play('walk_'+this.dir,true);else p.anims.play('idle_'+this.dir,true);
    p.setDepth(p.y+18);this.sh.setPosition(p.x,p.y+19).setDepth(p.y+17);
    this.tag.setPosition(Math.round(p.x),Math.round(p.y-29)).setDepth(p.y+19);
    this.dot.setPosition(p.x,p.y);
    near=null;
    for(const b of B){if(Phaser.Math.Distance.Between(p.x,p.y,b.x,b.y+26)<64){near=b;break}}
    if(this.lock&&(!near||near.k!==this.lock))this.lock=null;
    if(near&&!isOpen&&!this.lock&&dy<0&&Math.abs(p.x-near.x)<36&&p.y<near.y+26){this.lock=near.k;openP(near.k);return}
    if(near&&!isOpen){hint.style.display='block';hint.textContent=(matchMedia('(hover:none)').matches?'WALK UP OR TAP ENTER':'WALK UP TO THE DOOR')+' · '+near.n}
    else hint.style.display='none';
